[project]
name = "webcrawler"
version = "0.1.0"
description = "Fast, single-domain asynchronous web crawler with a command line interface."
readme = "README.md"
authors = [
    { name = "MartimMelo111", email = "martimcoelhomelo@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx[http2]>=0.28.1",
    "selectolax>=0.4.13",
]

[project.scripts]
webcrawler = "webcrawler.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Tests live next to the code they test; keep them out of the installed package.
wheel-exclude = ["*_test.py", "conftest.py", "testing"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*_test.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"

[tool.coverage.run]
source = ["webcrawler"]
branch = true
omit = ["*/*_test.py", "*/conftest.py", "*/testing/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PT"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "selectolax.*"
ignore_missing_imports = true
